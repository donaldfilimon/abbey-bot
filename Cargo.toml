[package]
name = "abbey-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
# Already in the tree via serenity (which pins the rustls stack); promoted to a
# direct dependency for the /persona ask backend call, with features matching
# serenity's so no second TLS stack is pulled in.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
serenity = "0.12.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
