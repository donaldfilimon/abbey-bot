[package]
name = "abbey-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
poise = { version = "0.6.2", default-features = false, features = ["cache", "chrono", "handle_panics"] }
# Promoted to a direct dependency for the /persona ask backend call. Keep the
# 0.12 line because Serenity's Rustls feature names reqwest's 0.12
# `rustls-tls` feature; reqwest 0.13 removed that feature name. All HTTP and
# WebSocket clients use Rustls with compiled WebPKI roots below.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
serenity = { version = "0.12.5", default-features = false, features = ["default_no_backend", "rustls_backend", "collector"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
# Promoted to a direct dependency for the Slack Socket Mode and explicit
# OpenAI Realtime adapters. Disable defaults so the TLS root source remains an
# explicit compiled WebPKI choice rather than a platform-native dependency.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Discord voice. Songbird 0.6 is the first release line with the DAVE/MLS
# support Discord requires in 2026; `receive` exposes decoded, jitter-buffered
# 20 ms voice ticks for the Realtime bridge.
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "rustls", "serenity", "tungstenite", "receive"] }
# Songbird's RawAdapter registers its raw container but leaves Symphonia codec
# features to the application. PCM is required to decode the f32 stream used by
# consented live-voice output.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
memchr = "2.8"
# Validate every accepted attachment under bounded decoder limits before handing
# it to an OpenAI-compatible vision endpoint. GIF is normalized to first-frame
# PNG because Ollama rejects the otherwise valid image/gif data-URL prefix.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
regex = "1.13.1"

[patch.crates-io]
# openmls_rust_crypto 0.5.1 is the API line required by davey 0.1.4, but its
# published manifest pins the vulnerable HPKE 0.6/libcrux SHA3 stack. The
# reviewed local copy changes only those three dependency versions to the
# compatible fixed HPKE 0.7 RustCrypto line; see its PATCH.md.
openmls_rust_crypto = { path = "patches/openmls_rust_crypto-0.5.1" }
