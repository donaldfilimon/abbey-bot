<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abbey</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --fg: #f4f1ea;
        --muted: #a8a29a;
        --card: #151922;
        --accent: #c4b5a0;
        --ok: #7dcea0;
        --wait: #e6c07b;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 2.5rem;
      }
      h1 {
        font-size: 2.5rem;
        letter-spacing: 0.04em;
        margin: 0 0 0.35rem;
      }
      .tagline {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .card {
        background: var(--card);
        border-radius: 0.85rem;
        padding: 1rem 1.1rem;
        margin: 0 0 0.75rem;
      }
      .label {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .value {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.35;
        word-break: break-word;
      }
      .mode-idle { color: var(--ok); }
      .mode-waiting { color: var(--wait); }
      .hint {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
      }
      ul.participants {
        margin: 0;
        padding-left: 1.1rem;
      }
      ul.participants li { margin: 0.15rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Abbey</h1>
      <p class="tagline">Intelligence Without Limits</p>

      <section class="card" aria-live="polite">
        <span class="label">Status</span>
        <p class="value" id="status">Starting…</p>
      </section>

      <section class="card">
        <span class="label">Mode</span>
        <p class="value mode-waiting" id="mode">waiting</p>
      </section>

      <section class="card">
        <span class="label">Voice channel</span>
        <p class="value" id="channel">—</p>
      </section>

      <section class="card">
        <span class="label">Guild</span>
        <p class="value" id="guild">—</p>
      </section>

      <section class="card">
        <span class="label">Participants</span>
        <p class="value" id="participants">—</p>
      </section>

      <section class="card">
        <span class="label">Auth</span>
        <p class="value" id="auth">—</p>
      </section>

      <p class="hint" id="hint">
        Launch Abbey from the Discord rocket in a voice channel. Conversational
        voice still needs /voice join consent:true — this Activity never fakes Go Live.
      </p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
