{
  "name": "Rust (deployment proposal, dormant)",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "rust-deployment-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "CARGO_TERM_COLOR": "always"
  },
  "jobs": {
    "gate-macos": {
      "name": "Gate (macOS)",
      "if": "github.repository == 'donaldfilimon/abbey-bot' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))",
      "runs-on": [
        "self-hosted",
        "macOS",
        "ARM64",
        "abbey-bot"
      ],
      "timeout-minutes": 60,
      "defaults": {
        "run": {
          "working-directory": "abbey-bot",
          "shell": "sh"
        }
      },
      "env": {
        "ABBEY_REQUIRE_WDBX_CONFORMANCE": "1",
        "ABBEY_WDBX_REPO": "${{ github.workspace }}/wdbx"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "path": "abbey-bot",
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Checkout verified WDBX contract revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "donaldfilimon/wdbx",
            "ref": "9fee98ff5ccb92fa86a2ed44f93abd65e7e181ae",
            "path": "wdbx",
            "persist-credentials": false
          }
        },
        {
          "name": "Choose this run build directory",
          "run": "echo \"CARGO_TARGET_DIR=$RUNNER_TEMP/abbey-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Check host prerequisites",
          "run": "set -eu\nfor tool in rustup cargo python3 plutil xcrun; do\n  command -v \"$tool\" >/dev/null 2>&1 || exit 1\ndone\npython3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'\nenv -u TOOLCHAINS xcrun swift --version"
        },
        {
          "name": "Install pinned cargo-audit report tool",
          "run": "cargo install cargo-audit --version 0.22.2 --locked"
        },
        {
          "name": "Strict source gate",
          "run": "./check.sh"
        },
        {
          "name": "Remove disposable build output",
          "if": "${{ always() && env.CARGO_TARGET_DIR != '' }}",
          "run": "case \"$CARGO_TARGET_DIR\" in\n  \"$RUNNER_TEMP\"/abbey-deploy-*) rm -rf -- \"$CARGO_TARGET_DIR\" ;;\n  *) exit 1 ;;\nesac"
        }
      ]
    },
    "deploy-macos": {
      "name": "Deploy (macOS)",
      "if": "github.repository == 'donaldfilimon/abbey-bot' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.gate-macos.result == 'success'",
      "runs-on": [
        "self-hosted",
        "macOS",
        "ARM64",
        "abbey-bot"
      ],
      "timeout-minutes": 60,
      "defaults": {
        "run": {
          "working-directory": "abbey-bot",
          "shell": "sh"
        }
      },
      "env": {
        "ABBEY_REQUIRE_WDBX_CONFORMANCE": "1",
        "ABBEY_WDBX_REPO": "${{ github.workspace }}/wdbx"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "path": "abbey-bot",
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Checkout verified WDBX contract revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "donaldfilimon/wdbx",
            "ref": "9fee98ff5ccb92fa86a2ed44f93abd65e7e181ae",
            "path": "wdbx",
            "persist-credentials": false
          }
        },
        {
          "name": "Choose this run build directory",
          "run": "echo \"CARGO_TARGET_DIR=$RUNNER_TEMP/abbey-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Check host prerequisites",
          "run": "set -eu\nfor tool in rustup cargo python3 plutil xcrun; do\n  command -v \"$tool\" >/dev/null 2>&1 || exit 1\ndone\npython3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'\nenv -u TOOLCHAINS xcrun swift --version"
        },
        {
          "name": "Install pinned cargo-audit report tool",
          "run": "cargo install cargo-audit --version 0.22.2 --locked"
        },
        {
          "name": "Strict source gate",
          "run": "./check.sh"
        },
        {
          "name": "Qualify the exact gated candidate with synthetic FM probes",
          "run": "set -eu\numask 077\nmkdir -p \"$CARGO_TARGET_DIR/qualification\"\nchmod 700 \"$CARGO_TARGET_DIR/qualification\"\nenv -i HOME=\"$HOME\" PATH=\"$PATH\" ABBEY_FM_MODE=pcc,system ABBEY_FM_ROLE=primary ABBEY_FM_CLI=/usr/bin/fm python3 -I deploy/publish-provider-qualification.py --binary \"$CARGO_TARGET_DIR/release/abbey-bot\" --target fm --output \"$CARGO_TARGET_DIR/qualification/fm.json\""
        },
        {
          "name": "Publish binary and qualification in one verified install transaction",
          "run": "./deploy/install-launchd.sh --qualified-candidate \"$CARGO_TARGET_DIR/release/abbey-bot\" \"$CARGO_TARGET_DIR/qualification/fm.json\" \"$GITHUB_SHA\""
        },
        {
          "name": "Remove disposable build output",
          "if": "${{ always() && env.CARGO_TARGET_DIR != '' }}",
          "run": "case \"$CARGO_TARGET_DIR\" in\n  \"$RUNNER_TEMP\"/abbey-deploy-*) rm -rf -- \"$CARGO_TARGET_DIR\" ;;\n  *) exit 1 ;;\nesac"
        }
      ],
      "needs": "gate-macos",
      "concurrency": {
        "group": "abbey-bot-production-deployment",
        "cancel-in-progress": false
      }
    }
  }
}
