name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's rustup honours rust-toolchain.toml, so the channel it
      # names (a floating nightly, with rustfmt and clippy) is installed on
      # first cargo invocation.
      - name: Gate — fmt, clippy -D warnings, tests
        run: ./check.sh
