name: Zig

# Gate for zig/, the stdlib-only Zig rewrite folded into this repository on
# 2026-09-28 (formerly the separate abbey-bot-zig repository, whose own
# .github/workflows/ci.yml GitHub never reads from a subdirectory). It runs
# only when zig/ or this file changes. It runs on the macOS arm64 self-hosted
# runner labelled abbey-bot, for trusted same-repo events only (push to main
# and same-repo pull requests); fork pull requests get no job. It moved there
# from GitHub-hosted macos-15 on 2026-09-28 because hosted Actions are
# billing-locked. The pinned Zig is downloaded into RUNNER_TEMP per run and
# never installed on the host. See docs/ops/self-hosted-runner.md.
on:
  push:
    branches: ["main"]
    paths:
      - "zig/**"
      - ".github/workflows/zig.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "zig/**"
      - ".github/workflows/zig.yml"

permissions:
  contents: read

concurrency:
  group: zig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (zig)
    if: >
      github.repository == 'donaldfilimon/abbey-bot' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abbey-bot]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zig
    steps:
      # Full history so the gate's oracle provenance stage can read the pinned
      # oracle commit; a shallow clone makes that stage print SKIP.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Zig master
        run: |
          set -eu
          version=$(sed -n 's/.*\.minimum_zig_version = "\(.*\)",/\1/p' build.zig.zon)
          curl -fsSL "https://ziglang.org/builds/zig-aarch64-macos-${version}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-${version}" >> "$GITHUB_PATH"
      - name: Gate
        run: ./tools/check.sh
